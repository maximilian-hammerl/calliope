<!-- @dsCard group="Type" viewport="700x140" name="Mono labels — IBM Plex Mono" subtitle="The only uppercase in the product; rail labels and file types" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}</style>
</head><body>
<div style="display:flex;gap:26px;align-items:baseline">
  <span class="calliope-label">Meine Gruppen</span>
  <span class="calliope-label">Gruppen-Kontext</span>
  <span style="font:var(--text-label);letter-spacing:var(--label-tracking);text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border-default);padding:4px 7px;border-radius:var(--radius-tag)">Privat</span>
  <span style="font:var(--text-filetype);color:var(--text-meta)">PNG</span>
  <span style="font:var(--text-filetype);color:var(--text-meta)">MD</span>
</div>
<div style="margin-top:14px;font:var(--text-hint);color:var(--ink-5)">--text-label 600 10.5px + --label-tracking .12em, uppercase · --text-filetype 11px, not a file icon</div>
</body></html>
