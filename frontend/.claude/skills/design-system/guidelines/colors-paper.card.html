<!-- @dsCard group="Colors" viewport="700x150" name="Paper" subtitle="Surfaces: rails recess, canvas sits above, raised is lightest" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.r{display:flex;gap:0}.s{flex:1;height:66px;box-sizing:border-box;border:1px solid var(--line-3)}.n{margin-top:6px;font:var(--text-hint);color:var(--ink-5);display:flex;gap:0}.n span{flex:1}</style>
</head><body>
<div class="r">
  <div class="s" style="background:var(--paper-0)"></div>
  <div class="s" style="background:var(--paper-1)"></div>
  <div class="s" style="background:var(--paper-2)"></div>
  <div class="s" style="background:var(--paper-3)"></div>
  <div class="s" style="background:var(--paper-4)"></div>
  <div class="s" style="background:var(--paper-edge)"></div>
</div>
<div class="n"><span>--paper-0 #fffdf9<br>raised</span><span>--paper-1 #f7f4ee<br>canvas</span><span>--paper-2 #f2ede3<br>rail</span><span>--paper-3 #eee5d3<br>quiet fill</span><span>--paper-4 #e5d9c2<br>avatar</span><span>--paper-edge #efe9de<br>edge strip</span></div>
</body></html>
