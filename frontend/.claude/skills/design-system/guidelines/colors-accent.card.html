<!-- @dsCard group="Colors" viewport="700x150" name="Accent & signals" subtitle="One hue only; signals exist for validation and appear nowhere in the UI" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.w{display:flex;gap:14px;align-items:flex-start}.c{width:96px}.sw{height:52px;border-radius:var(--radius-control)}.t{margin-top:6px;font:var(--text-hint);color:var(--ink-5)}</style>
</head><body>
<div class="w">
  <div class="c"><div class="sw" style="background:var(--accent)"></div><div class="t">--accent<br>#8a6a3a underline, caret</div></div>
  <div class="c"><div class="sw" style="background:var(--accent-deep)"></div><div class="t">--accent-deep<br>#4f4132 solid buttons</div></div>
  <div class="c"><div class="sw" style="background:var(--accent-deeper)"></div><div class="t">--accent-deeper<br>#3f3427 hover</div></div>
  <div class="c" style="margin-left:auto"><div class="sw" style="background:var(--signal-error)"></div><div class="t">--signal-error<br>validation only</div></div>
  <div class="c"><div class="sw" style="background:var(--signal-ok)"></div><div class="t">--signal-ok<br>validation only</div></div>
</div>
</body></html>
