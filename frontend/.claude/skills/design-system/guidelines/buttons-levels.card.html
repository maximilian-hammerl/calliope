<!-- @dsCard group="Brand" viewport="700x150" name="Action levels" subtitle="Solid for the one primary act, quiet for affirmative side actions, plain for post actions" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.w{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
</head><body>
<div class="w">
  <span style="font:var(--text-control);color:var(--action-solid-fg);background:var(--action-solid-bg);padding:8px 16px;border-radius:var(--radius-control)">Beitrag senden</span>
  <span style="font:var(--text-control);font-weight:500;color:var(--action-quiet-fg);background:var(--action-quiet-bg);border:1px solid var(--action-quiet-border);padding:7px 12px;border-radius:var(--radius-control)">Mitglied einladen</span>
  <span style="font:var(--text-control);color:var(--action-quiet-fg);background:var(--surface-raised);border:1px solid var(--border-default);padding:7px 12px;border-radius:var(--radius-control)">Vorschau</span>
  <span style="font:var(--text-action);color:var(--action-plain-fg)">Antworten</span>
  <span style="font:var(--text-control);color:var(--ink-6);background:var(--paper-2);border:1px solid var(--border-default);padding:7px 12px;border-radius:var(--radius-control)">Deaktiviert</span>
</div>
<div style="margin-top:14px;font:var(--text-hint);color:var(--ink-5)">Hover darkens one step · press one further · focus 2px --focus-ring at 2px offset · no lift, no scale</div>
</body></html>
