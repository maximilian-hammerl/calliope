<!-- @dsCard group="Brand" viewport="700x210" name="Post rhythm" subtitle="Recessed metadata, boxless prose, one full hairline between posts" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}</style>
</head><body>
<div style="max-width:640px">
  <div style="font:var(--text-meta);color:var(--text-meta);margin-bottom:9px">Alice · Dienstag, 09:14</div>
  <div style="font:var(--text-post);color:var(--text-prose);text-wrap:pretty">Sie zog den Kragen höher und trat zwischen die Stände. Öl, Papier, kalter Stein.</div>
  <div style="display:flex;gap:16px;margin-top:14px;font:var(--text-action);color:var(--action-plain-fg)"><span>Antworten</span><span>Zitieren</span><span>Merken</span></div>
  <div style="border-top:1px solid var(--border-divider);margin:26px 0"></div>
  <div style="font:var(--text-meta);color:var(--text-meta);margin-bottom:9px">Bob · vor 12 Minuten · bearbeitet</div>
  <div style="font:var(--text-post);color:var(--text-prose);text-wrap:pretty">„Alle, die so gehen, wollen verkaufen."</div>
</div>
</body></html>
