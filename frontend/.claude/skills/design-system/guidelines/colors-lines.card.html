<!-- @dsCard group="Colors" viewport="700x140" name="Hairlines" subtitle="All structure is 1px; 2px is reserved for the active tab and notes rule" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.row{display:flex;flex-direction:column;gap:12px}.l{display:flex;align-items:center;gap:12px;font:var(--text-hint);color:var(--ink-5)}.l i{flex:1;height:0}</style>
</head><body>
<div class="row">
  <div class="l"><i style="border-top:1px solid var(--line-1)"></i>--line-1 hairline inside composer</div>
  <div class="l"><i style="border-top:1px solid var(--line-2)"></i>--line-2 divider between posts</div>
  <div class="l"><i style="border-top:1px solid var(--line-3)"></i>--line-3 subtle: rails, top bar</div>
  <div class="l"><i style="border-top:1px solid var(--line-4)"></i>--line-4 default: inputs, toggles</div>
  <div class="l"><i style="border-top:1px solid var(--line-5)"></i>--line-5 strong: quiet buttons</div>
  <div class="l"><i style="border-top:2px solid var(--accent)"></i>2px --accent active tab only</div>
</div>
</body></html>
