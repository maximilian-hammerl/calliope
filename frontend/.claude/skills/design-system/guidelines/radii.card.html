<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.w{display:flex;gap:16px;align-items:flex-start}.c{text-align:center}.b{width:74px;height:52px;background:var(--surface-raised);border:1px solid var(--line-4)}.n{font:var(--text-hint);color:var(--ink-5);margin-top:6px}</style>
</head><body>
<div class="w">
  <div class="c"><div class="b" style="border-radius:var(--radius-tag)"></div><div class="n">3px<br>tags, badges</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-xs)"></div><div class="n">4px<br>rail toggles</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-control)"></div><div class="n">6px<br>buttons, inputs, panels</div></div>
  <div class="c"><div class="b" style="width:52px;border-radius:var(--radius-circle)"></div><div class="n">50%<br>avatars only</div></div>
  <div class="c"><div class="b" style="border-radius:0"></div><div class="n">0<br>reading surfaces</div></div>
</div>
</body></html>
