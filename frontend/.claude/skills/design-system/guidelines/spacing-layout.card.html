<!-- @dsCard group="Spacing" viewport="700x170" name="Layout frame" subtitle="Fixed 54px bar, 262px rails, 34px collapsed, 684px reading cap, centred between them" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}</style>
</head><body>
<div style="border:1px solid var(--line-3);background:var(--surface-app)">
  <div style="height:22px;background:var(--surface-raised);border-bottom:1px solid var(--line-3);font:var(--text-hint);color:var(--ink-5);padding:3px 8px;box-sizing:border-box">--topbar-h 54px</div>
  <div style="display:flex;height:92px">
    <div style="width:112px;background:var(--surface-rail);border-right:1px solid var(--line-3);font:var(--text-hint);color:var(--ink-5);padding:6px">262px<br>rail-left</div>
    <div style="flex:1;padding:6px;font:var(--text-hint);color:var(--ink-5)">reading column — max 684px, centred between the rails' widths, so collapsing one does not move it<div style="margin-top:6px;height:34px;border:1px dashed var(--line-5);max-width:220px"></div></div>
    <div style="width:14px;background:var(--paper-edge);border-left:1px solid var(--line-3)"></div>
    <div style="width:112px;background:var(--surface-rail);border-left:1px solid var(--line-3);font:var(--text-hint);color:var(--ink-5);padding:6px">262px<br>rail-right<br><span style="color:var(--ink-6)">34px collapsed →</span></div>
  </div>
</div>
</body></html>
