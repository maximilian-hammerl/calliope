<!-- @dsCard group="Type" viewport="700x180" name="Interface — IBM Plex Sans" subtitle="Five sizes, 11.5–13.5px; metadata is deliberately recessed" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}.r{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}.t{width:150px;font:var(--text-hint);color:var(--ink-5)}</style>
</head><body>
<div class="r"><span class="t">--text-nav 13.5px</span><span style="font:var(--text-nav);color:var(--text-title)">Meine Gruppen</span></div>
<div class="r"><span class="t">--text-row 13px</span><span style="font:var(--text-row);color:var(--text-secondary)">Der Erinnerungsmarkt</span></div>
<div class="r"><span class="t">--text-control 12.5px</span><span style="font:var(--text-control);color:var(--text-secondary)">Mitglied einladen</span></div>
<div class="r"><span class="t">--text-action 12px</span><span style="font:var(--text-action);color:var(--text-muted)">Antworten · Zitieren · Merken</span></div>
<div class="r"><span class="t">--text-meta 12px</span><span style="font:var(--text-meta);color:var(--text-meta)">Bob · vor 12 Minuten · bearbeitet</span></div>
<div class="r"><span class="t">--text-hint 11.5px</span><span style="font:var(--text-hint);color:var(--text-muted)">6 von 12 Threads</span></div>
</body></html>
