extends:
  - "spectral:oas"

rules:
  # `generate_open_api_spec.ts` drops both from this file, since they come from `.env`; the served
  # document has them.
  oas3-api-servers: off
  info-contact: off

  # `spectral:oas` checks the description and tags of every operation except a `query` one.
  query-operation-documented:
    message: "{{property}} must be present and non-empty."
    given: "$.paths.*.query"
    severity: warn
    then:
      - field: description
        function: truthy
      - field: tags
        function: truthy
