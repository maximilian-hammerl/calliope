version: 2

updates:
  # The pnpm workspace: its root holds the one lockfile and the catalog.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # The `minimumReleaseAge` in pnpm-workspace.yaml, so a proposed version is one pnpm installs.
    cooldown:
      default-days: 1
    ignore:
      # vue-tsc and kysely-codegen need the classic TypeScript API, which 7.0 no longer exports;
      # 7.1 is meant to bring a stable one. Only 7.0.x, so 7.1 is still proposed when it ships (#6).
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
