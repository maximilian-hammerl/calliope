name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .example.env .env
        working-directory: .

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lints and types
        run: pnpm run validate:check

      - name: Check the OpenAPI specification is up to date
        run: pnpm run open-api:check

      - name: Lint the OpenAPI specification
        run: pnpm run open-api:lint

      # dbmate is a plain binary rather than a package, so installing it lets the pipeline run
      # the repository's own scripts instead of restating their configuration.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # `--wait` blocks on the healthchecks in the compose file, so nothing races the
      # databases becoming reachable.
      - name: Start the databases and the mail catcher
        run: docker compose up -d --wait
        working-directory: .

      - name: Apply migrations
        run: pnpm run migrations:migrate
        working-directory: database

      - name: Run tests
        run: pnpm run test

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .example.env .env
        working-directory: .

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lints and types
        run: pnpm run validate:check

      # dbmate is a plain binary rather than a package, so installing it lets the pipeline run
      # the repository's own scripts instead of restating their configuration.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Start the database
        run: docker compose up -d --wait db
        working-directory: .

      # The migrations are what these tests exercise, so they are applied here rather than
      # assumed. Rolling all the way down and up again proves every `migrate:down` really
      # reverses its `migrate:up` — a trigger function left behind breaks the next deploy.
      - name: Apply migrations
        run: pnpm run migrations:migrate

      - name: Check the migrations roll back and forward again
        run: |
          # One rollback per migration file, so this neither stops short of the oldest one
          # nor runs past it. A failure here is a `migrate:down` that does not reverse its
          # `migrate:up`, and it has to fail the step rather than be swallowed.
          for migration in migrations/*.sql; do pnpm run migrations:rollback; done
          pnpm run migrations:migrate

      # Deleted first: kysely-codegen that cannot read its config still succeeds, writing elsewhere.
      - name: Generate the types
        run: |
          rm ../backend/src/database/schema.ts
          pnpm run types:generate

      # Formatted in backend/, whose formatter config the committed file follows.
      - name: Check the generated types are up to date
        working-directory: backend
        run: |
          pnpm exec oxfmt src/database/schema.ts
          git diff --exit-code -- src/database/schema.ts

      - name: Run tests
        run: pnpm run test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated client is git-ignored, so a fresh checkout has none and the type check
      # would fail on the missing imports. Generating from the committed spec also means a
      # client that no longer matches it breaks the build here.
      - name: Generate the API client
        run: pnpm run open-api:generate-client

      # Ends with knip over the whole workspace, which detects unused dependencies, exports, files
      # and catalog entries — see knip.jsonc at the root.
      - name: Check formatting, lints, types and unused code
        run: pnpm run validate:check

      - name: Run tests
        run: pnpm run test:unit --run
