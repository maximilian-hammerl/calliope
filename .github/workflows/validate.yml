name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .example.env .env
        working-directory: .

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lints, types and unused code
        run: pnpm run validate:check

      - name: Check the OpenAPI specification is up to date
        run: pnpm run open-api:check

      - name: Lint the OpenAPI specification
        run: pnpm run open-api:lint

      # `--wait` blocks on the healthchecks in the compose file, so nothing races the
      # databases becoming reachable.
      - name: Start the databases and the mail catcher
        run: docker compose up -d --wait
        working-directory: .

      - name: Apply migrations
        run: pnpm run migrations:migrate
        working-directory: database

      - name: Run tests
        run: pnpm run test

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database

    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .example.env .env
        working-directory: .

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lints, types and unused code
        run: pnpm run validate:check

      - name: Start the database
        run: docker compose up -d --wait db
        working-directory: .

      # The migrations are what these tests exercise, so they are applied here rather than
      # assumed. Rolling all the way down and up again proves every `migrate:down` really
      # reverses its `migrate:up` — a trigger function left behind breaks the next deploy.
      - name: Apply migrations
        run: pnpm run migrations:migrate

      - name: Check the migrations roll back and forward again
        run: |
          # One rollback per migration file, so this neither stops short of the oldest one
          # nor runs past it. A failure here is a `migrate:down` that does not reverse its
          # `migrate:up`, and it has to fail the step rather than be swallowed.
          for migration in migrations/*.sql; do pnpm run migrations:rollback; done
          pnpm run migrations:migrate

      # Deleted first: kysely-codegen that cannot read its config still succeeds, writing elsewhere.
      - name: Generate the types
        run: |
          rm ../backend/src/database/schema.ts
          pnpm run types:generate

      # Formatted in backend/, whose formatter config the committed file follows.
      - name: Check the generated types are up to date
        working-directory: backend
        run: |
          pnpm exec oxfmt src/database/schema.ts
          git diff --exit-code -- src/database/schema.ts

      - name: Run tests
        run: pnpm run test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, whose pnpm cache asks pnpm where its store is. Installs the version
      # `packageManager` in the root package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated client is git-ignored, so a fresh checkout has none and the type check
      # would fail on the missing imports. Generating from the committed spec also means a
      # client that no longer matches it breaks the build here.
      - name: Generate the API client
        run: pnpm run open-api:generate-client

      # Ends with knip over the whole workspace, which detects unused dependencies, exports, files
      # and catalog entries — see knip.jsonc at the root.
      - name: Check formatting, lints, types and unused code
        run: pnpm run validate:check

      - name: Run tests
        run: pnpm run test:unit --run

  # Set up as deployment/README.md, "Deploying on a merge", says.
  deploy:
    name: Deploy to testing
    needs: [backend, database, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testing
    # One at a time: a second start joins the running deploy and reports that deploy's result.
    concurrency: deploy-testing

    steps:
      - name: Deploy over SSH
        # Explicitly, because only an explicit bash adds pipefail: without it a failed ls-remote
        # reads as an empty answer, which the check below takes for "main has moved on".
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          # deploy.sh deploys the newest commit on main, so this run would ship a newer commit
          # before that commit's checks finish. Its own run deploys it once they pass.
          latest="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main |
            cut -f 1)"
          [ -n "$latest" ] || { echo "::error::Could not read where main points."; exit 1; }
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $latest, whose own run deploys it."
            exit 0
          fi

          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"

          # The key's forced command decides what runs, so nothing is sent. It prints only once the
          # deploy has ended; the keepalives hold the quiet connection open until then.
          ssh -T -i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$DEPLOY_SSH_HOST"
