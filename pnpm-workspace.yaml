packages:
  - backend
  - database
  - frontend

# Exact versions, as everywhere in this repository: `pnpm add` writes no caret.
savePrefix: ""

# A release is installed once it is a day old, as Dependabot's cooldown says too. Not strict, so a
# younger version pinned on purpose, for an upstream fix, still installs.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false

# A version more than one project uses, named `catalog:` in each of them.
catalog:
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2006
  pg: 8.23.1
  typescript: 6.0.3
  zod: 4.6.7

# No dependency runs install scripts unless listed `true`. These four work without theirs: esbuild
# and fsevents ship prebuilt binaries, vue-demi's only switches between Vue 2 and 3 builds, and
# Spectral's @scarf/scarf only reports the install as analytics.
allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  fsevents: false
  vue-demi: false

# Agent skills that dependencies bring. LogTape's is its general manual: the backend's logging is
# one module with its own rules in `.claude/rules/backend/operations.md`.
permissions:
  "@logtape/logtape":
    skills: false

# Until asteasolutions/zod-to-openapi#401 is released: a regex's `pattern` from its `.source`,
# since `toString()` leaves the flags in. `backend/Dockerfile` (and its `.dockerignore`) and
# `docker-compose.deploy.yaml` copy `patches/` too; remove them with it.
patchedDependencies:
  '@asteasolutions/zod-to-openapi@9.1.0': patches/@asteasolutions__zod-to-openapi@9.1.0.patch
