packages:
  - frontend

# Exact versions, as everywhere in this repository: `pnpm add` writes no caret.
savePrefix: ""

# No dependency runs install scripts unless listed `true`. These three work without theirs: esbuild
# and fsevents ship prebuilt binaries, and vue-demi's only switches between Vue 2 and 3 builds.
allowBuilds:
  esbuild: false
  fsevents: false
  vue-demi: false

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.107.1"
  - "@tanstack/vue-query@5.107.1"
