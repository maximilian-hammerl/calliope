packages:
  - backend
  - database
  - frontend

# Exact versions, as everywhere in this repository: `pnpm add` writes no caret.
savePrefix: ""

# A version more than one project uses, named `catalog:` in each of them.
catalog:
  "@types/node": 26.6.6
  oxfmt: 0.76.0
  oxlint: 1.91.0
  oxlint-tsgolint: 7.0.2006
  typescript: 6.0.3
  zod: 4.6.7

# No dependency runs install scripts unless listed `true`. These four work without theirs: esbuild
# and fsevents ship prebuilt binaries, vue-demi's only switches between Vue 2 and 3 builds, and
# Spectral's @scarf/scarf only reports the install as analytics.
allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  fsevents: false
  vue-demi: false
